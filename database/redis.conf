# ==============================================================================
# 白猫打狗机器人 (WhiteCat Trading Bot)
# Redis 7 极速内存配置 (超低延迟打狗调优)
# ==============================================================================

# 基础网络与端口
bind 127.0.0.1 ::1
port 6379
tcp-backlog 4096
timeout 0
tcp-keepalive 60

# 守护与日志
daemonize no
loglevel notice
logfile ""

# 内存策略 (极致压榨内存与极速吞吐)
maxmemory 2gb
maxmemory-policy allkeys-lru

# 高性能 I/O 多线程 (开启 4 个后台 I/O 线程)
io-threads 4
io-threads-do-reads yes

# 持久化策略 (打狗机器人对低延迟优先，异步落盘)
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error no
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir ./

# AOF 异步写入 (兼顾数据恢复与 0 停顿)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Pub/Sub 缓冲区 (保障高频行情广播不丢包)
client-output-buffer-limit pubsub 64mb 16mb 60
client-output-buffer-limit normal 0 0 0

# 客户端与慢查询监控
maxclients 10000
slowlog-log-slower-than 10000
slowlog-max-len 1024
